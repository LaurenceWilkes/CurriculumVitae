name: Build latex file and deploy
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error cv.tex
          mkdir public
          cp cv.pdf public/
          cp -r site/* public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
